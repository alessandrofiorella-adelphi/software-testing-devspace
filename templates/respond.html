{% extends "base.html" %}
{% block title %}Home Page{% endblock %}
{% block body_id %}homeBody{% endblock %}
{% block content %}

<div class="navbar" id="loginButtons">
    <a href="{{ url_for('logout') }}">Logout</a>
</div>

<div class="navbar">
    <a href="{{ url_for('home') }}">Home</a>
</div>
<center>
    <div id="loginForm">
        <form action="{{ url_for('giveResponse', id=comment.id) }}" method="POST" style="display:inline;">
            <label for="comment">Comment:</label>
            <textarea name="comment" rows = "5" cols = "40" required> </textarea>
            <br>
            <button type="submit" class="button">Respond</button>
        </form>
    </div>
</center>
{% endblock %}
