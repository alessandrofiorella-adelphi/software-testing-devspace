{% extends "base.html" %}
{% block title %}Home Page{% endblock %}
{% block body_id %}homeBody{% endblock %}
{% block content %}

<div class="navbar" id="loginButtons">
    <a href="{{ url_for('logout') }}">Logout</a>
</div>

<div class="navbar">
    <a href="{{ url_for('home') }}">Home</a>
</div>
<center>
    <div>
        <h2>Comment</h2>
        <div class="feedback-column">
            <div class="feedback-item-row">
                <div class="feedback-item-cell"> {{ feedback.date }} </div>
                <div class="feedback-item-cell"> {{ feedback.comment }} </div>
                <div class="feedback-item-cell"> {{ feedback.user.fname}} {{ feedback.user.lname }}</div>
            </div>
        </div>
    </div>
    <br>
<form action="{{ url_for('giveResponse', id=feedback.id) }}" method="POST" style="display:inline;">
    <label for="responseTime"></label>
    <input type="date" name="responseTime" id="responseTime" required>
    <br>
    <textarea name="comment" rows = "5" cols = "50" required> </textarea>
    <br>
    <button type="submit" class="button">Respond</button>
</form>
</center>
{% endblock %}
