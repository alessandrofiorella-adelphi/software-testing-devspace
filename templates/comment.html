{% extends "base.html" %}
{% block title %}Home Page{% endblock %}
{% block body_id %}homeBody{% endblock %}
{% block content %}

<div class="logs" id="loginButtons">
    <a href="{{ url_for('logout') }}">Logout</a>
</div>

<div class="navbar">
    <a href="{{ url_for('home') }}">Home</a>
</div>
<center>
<form action="{{ url_for('giveFeedback', id=build.id) }}" method="POST" style="display:inline;">
    <label for="testTime"></label>
    <input type="date" name="testTime" id="testTime" required>
    <br>
    <textarea name="comment" rows = "5" cols = "50" required> </textarea>
    <br>
    <button type="submit" class="button">Comment</button>
</form>
</center>
{% endblock %}
